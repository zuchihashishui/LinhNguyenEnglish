<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hệ thống điểm danh và quản lý học sinh Linh English" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="color-scheme" content="light dark" />
  <title>Điểm danh học sinh - Linh English</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='50%25' y='54%25' font-size='38' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brandHome">
      <span class="logo-icon">L</span>
      <span>Linh English - Điểm danh</span>
    </div>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="user-info" id="userInfo"></div>
  </header>

  <main id="app">
    <p class="loading">Đang tải...</p>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    // Chống cache cứng: tự thêm timestamp cho app.js
    document.write('<script src="js/app.js?v=' + Date.now() + '"><\/script>');
  </script>
  <script>
    // Hiện lỗi JS lên màn hình nếu app crash
    window.addEventListener('error', function (e) {
      const main = document.getElementById('app');
      if (main && !main.querySelector('.js-error')) {
        const d = document.createElement('div');
        d.className = 'card empty js-error';
        d.style.color = '#dc2626';
        d.textContent = '❌ Lỗi JavaScript: ' + (e.message || 'unknown');
        main.innerHTML = '';
        main.appendChild(d);
      }
    });
  </script>
</body>
</html>
